start:
  welcome: |
    Привет! Я бот, который поможет тебе удобно и быстро фиксировать данные об эпилептических приступах.

    <b>Доступные возможности:</b>
    - Заполнение/редактирование данных о приступах.
    - Легко делиться зафиксированными данными с доверенными лицами (ДЛ в меню).
    - Импортировать данные из exel таблицы или текстового файла.
    - Настроить регулярные уведомления о приеме лекарств.
    - Просмотр подробной статистики по зафиксированным приступам.

    <u>Перед регистрацией нужно принять оферту. Документ — в следующем сообщении.</u>
  to_register: "К регистрации"
  accept_oferta: "Принимаю условия"
  oferta_caption: |
    Оферта и политика обработки данных. Прочитайте файл.
    Кнопка «Принимаю условия» открывает бота. Без неё функции недоступны.
  oferta_caption_accepted: "Оферта уже принята. Файл можно открыть ещё раз."
  oferta_required_alert: "Сначала примите оферту. Документ отправлен в чат."
  oferta_accepted_alert: "Условия приняты"
  oferta_accepted_registered: "Условия приняты. Дальше можно пользоваться ботом: /menu"
  oferta_before_restore: "Аккаунт скрыт. Чтобы восстановить его, сначала примите оферту."
  oferta_file_missing: "Не удалось отправить файл оферты. Напишите администратору бота."
  finish_registration: "Сначала закончите регистрацию или отмените заполнение."
  deleted_use_start: "Аккаунт удалён. Откройте /start, чтобы восстановить его, пока не истёк срок хранения."
  already_registered: "Вы уже зарегистрированы. Используйте /menu для работы с ботом."
  deleted_account: |
    Ваш аккаунт был удалён. Данные сохранены до {retention_until}.
    Вы можете восстановить аккаунт в течение {days} дней.
  help: |
    У бота есть три основные команды:
     - /menu: присылает основное меню, через которое ведется всё взаимодействие с ботом.
     - /start: присылает привественное сообщение с руководством полльзователя.
     - /help: присылает инструкцию по пользованию ботом.
    Руководство по пользованию ботом:
